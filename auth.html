<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskMaster — Sign In</title>
  <link rel="stylesheet" href="auth.css"/>
  <link rel="stylesheet" href="nolan.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Cinematic canvas layers -->
  <canvas id="authCanvas"></canvas>
  <canvas id="authAurora"></canvas>

  <!-- Cinematic overlays -->
  <div class="auth-vignette"></div>
  <div class="auth-grain"></div>
  <div class="auth-scanlines"></div>

  <!-- Custom Nolan Cursor -->
  <div id="cursorDot"></div>
  <div id="cursorRing"></div>
  <div id="cursorGlow"></div>
  <div id="cursorTrail"></div>

  <!-- Main centered layout -->
  <div class="auth-root">
    <div class="auth-panel">

      <!-- Minimal Brand Header -->
      <div class="auth-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 48 48" fill="none">
            <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#lg1)"/>
            <path d="M14 24l7 7 13-14" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="lg1" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop stop-color="#8b5cf6"/>
                <stop offset="0.5" stop-color="#6366f1"/>
                <stop offset="1" stop-color="#3b82f6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-name">TaskMaster</span>
      </div>

      <!-- Glass Auth Card -->
      <div class="auth-card">

        <!-- Tab switcher -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabSignin" onclick="showTab('signin')">Sign In</button>
          <button class="auth-tab" id="tabSignup" onclick="showTab('signup')">Sign Up</button>
          <div class="tab-track">
            <div class="tab-thumb" id="tabThumb"></div>
          </div>
        </div>

        <!-- ── SIGN IN FORM ── -->
        <div class="auth-form active" id="formSignin">
          <div class="form-header">
            <h2>Welcome back 👋</h2>
            <p>Sign in to your TaskMaster account</p>
          </div>

          <div class="social-row">
            <button type="button" class="social-btn" onclick="openSocialModal('Google')">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              <span>Continue with Google</span>
            </button>
            <button type="button" class="social-btn" onclick="openSocialModal('GitHub')">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
              <span>Continue with GitHub</span>
            </button>
          </div>

          <div class="divider"><span>or continue with email</span></div>

          <form id="signinForm" onsubmit="handleSignin(event)">
            <div class="field">
              <label>Email address</label>
              <div class="input-wrap">
                <input type="email" id="siEmail" placeholder="you@example.com" required autocomplete="email"/>
              </div>
            </div>
            <div class="field">
              <label>
                Password
                <a href="#" class="forgot-link" onclick="forgotPassword(event)">Forgot password?</a>
              </label>
              <div class="input-wrap">
                <input type="password" id="siPassword" placeholder="Enter your password" required autocomplete="current-password"/>
                <button type="button" class="eye-btn" onclick="togglePwd('siPassword',this)" aria-label="Toggle password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div class="remember-row">
              <label class="check-label">
                <input type="checkbox" id="rememberMe"/>
                <span class="checkmark"></span>
                Remember me for 30 days
              </label>
            </div>

            <div class="auth-error" id="siError"></div>
            <div class="auth-success" id="siSuccess"></div>

            <button type="submit" class="btn-auth" id="siBtn">
              <span class="btn-text">Sign In</span>
              <span class="btn-spinner"></span>
              <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </form>

          <p class="auth-switch">Don't have an account? <a href="#" onclick="showTab('signup')">Sign up free →</a></p>
        </div>

        <!-- ── SIGN UP FORM ── -->
        <div class="auth-form" id="formSignup">
          <div class="form-header">
            <h2>Create account ✨</h2>
            <p>Start organizing your tasks today</p>
          </div>

          <div class="social-row">
            <button type="button" class="social-btn" onclick="openSocialModal('Google')">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              <span>Sign up with Google</span>
            </button>
            <button type="button" class="social-btn" onclick="openSocialModal('GitHub')">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
              <span>Sign up with GitHub</span>
            </button>
          </div>

          <div class="divider"><span>or sign up with email</span></div>

          <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="field-row">
              <div class="field">
                <label>First Name</label>
                <div class="input-wrap">
                  <input type="text" id="suFirst" placeholder="First name" required/>
                </div>
              </div>
              <div class="field">
                <label>Last Name</label>
                <div class="input-wrap">
                  <input type="text" id="suLast" placeholder="Last name" required/>
                </div>
              </div>
            </div>
            <div class="field">
              <label>Email address</label>
              <div class="input-wrap">
                <input type="email" id="suEmail" placeholder="you@example.com" required autocomplete="email"/>
              </div>
            </div>
            <div class="field">
              <label>Password</label>
              <div class="input-wrap">
                <input type="password" id="suPassword" placeholder="Min. 8 characters" required oninput="checkStrength(this.value)" autocomplete="new-password"/>
                <button type="button" class="eye-btn" onclick="togglePwd('suPassword',this)" aria-label="Toggle password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <div class="strength-wrap">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <span class="strength-label" id="strengthLabel"></span>
              </div>
            </div>
            <div class="field">
              <label>Confirm Password</label>
              <div class="input-wrap">
                <input type="password" id="suConfirm" placeholder="Repeat password" required autocomplete="new-password"/>
                <button type="button" class="eye-btn" onclick="togglePwd('suConfirm',this)" aria-label="Toggle password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div class="remember-row">
              <label class="check-label">
                <input type="checkbox" id="agreeTerms" required/>
                <span class="checkmark"></span>
                I agree to <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
              </label>
            </div>

            <div class="auth-error" id="suError"></div>
            <div class="auth-success" id="suSuccess"></div>

            <button type="submit" class="btn-auth" id="suBtn">
              <span class="btn-text">Create Account</span>
              <span class="btn-spinner"></span>
              <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </form>

          <p class="auth-switch">Already have an account? <a href="#" onclick="showTab('signin')">Sign in →</a></p>
        </div>

      </div>
    </div>
  </div>

  <!-- Social Account Chooser Modal -->
  <div class="social-modal-overlay" id="socialModalOverlay" onclick="closeSocialModalOnBackdrop(event)">
    <div class="social-modal-card" id="socialModalCard">
      <div class="social-modal-header" id="socialModalHeader"></div>
      <div class="social-modal-body" id="socialModalBody"></div>
      <div class="social-modal-footer">
        <button type="button" class="btn-social-cancel" onclick="closeSocialModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="cursor.js"></script>
</body>
</html>
